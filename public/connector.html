<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Member Handover Connector</title>
    <!-- Trello Power-Up Client Library -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
  </head>
  <body>
    <script>
      /* global window, TrelloPowerUp */
      if (typeof window !== 'undefined' && window.TrelloPowerUp) {
        var baseUrl = window.location.origin;

        window.TrelloPowerUp.initialize({
          // Adds the "Member Handover" button to the board header in Trello
          'board-buttons': function (t) {
            return [
              {
                icon: {
                  dark: baseUrl + '/favicon.svg',
                  light: baseUrl + '/favicon.svg',
                },
                text: 'Member Handover',
                callback: function (t) {
                  return t.modal({
                    title: 'Member Handover',
                    url: baseUrl + '/',
                    accentColor: '#0c66e4',
                    fullscreen: true,
                  });
                },
              },
            ];
          },

          'authorization-status': function (t) {
            return t.get('member', 'private', 'trello_token').then(function (token) {
              return { authorized: Boolean(token) };
            });
          },
        }, {
          appKey: '46cfbbb2d95db4d024a8584d3056c1c2',
          appName: 'Member Handover',
        });
      }
    </script>
  </body>
</html>
